name: Build precompiled NIFs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # NIF 2.16 supports Erlang/OTP 24 and later, including runtimes that
        # expose newer NIF versions.
        nif: ["2.16"]
        job:
          - { target: aarch64-apple-darwin, os: macos-15, builder: native }
          - { target: x86_64-apple-darwin, os: macos-15-intel, builder: native }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, builder: container, image: "rust:1.91.0-bullseye" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, builder: container, image: "rust:1.91.0-alpine3.22" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, builder: container, image: "rust:1.91.0-bullseye" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, builder: container, image: "rust:1.91.0-alpine3.22" }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, builder: native }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> "$GITHUB_ENV"

      - name: Install BEAM for native and glibc smoke tests
        if: ${{ !contains(matrix.job.target, 'musl') }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.15.7"
          otp-version: "26.2.3"

      - name: Cache Rust toolchain
        if: matrix.job.builder == 'native'
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rust-toolchain-${{ matrix.job.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            rust-toolchain-${{ matrix.job.target }}-
            rust-toolchain-

      - name: Install Rust toolchain
        if: matrix.job.builder == 'native'
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.job.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.job.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-${{ matrix.job.target }}-
            cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: native/rocker/target
          key: cargo-build-${{ matrix.job.target }}-${{ matrix.nif }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-build-${{ matrix.job.target }}-${{ matrix.nif }}-
            cargo-build-${{ matrix.job.target }}-

      - name: Build native target
        if: matrix.job.builder == 'native'
        id: build-native
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: rocker
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          # An unset value avoids a composite-action bug where its boolean
          # `false` default is treated as a truthy string.
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: native/rocker

      - name: Build Linux target in C++20 container
        if: matrix.job.builder == 'container'
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.job.image }}
          TARGET: ${{ matrix.job.target }}
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            --volume "$HOME/.cargo/git:/usr/local/cargo/git" \
            --workdir /work/native/rocker \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TARGET_DIR="/work/native/rocker/target/$TARGET" \
            --env RUSTFLAGS="-C target-feature=-crt-static" \
            --env TARGET="$TARGET" \
            "$CONTAINER_IMAGE" \
            sh -c '
              set -eu
              if [ -f /etc/alpine-release ]; then
                apk add --no-cache build-base clang-dev llvm-dev linux-headers pkgconf
              else
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                  build-essential clang-13 libclang-13-dev pkg-config
                rm -rf /var/lib/apt/lists/*
                export CC=clang-13
                export CXX=clang++-13
                export LIBCLANG_PATH=/usr/lib/llvm-13/lib
              fi
              rustc --version
              "${CXX:-c++}" --version
              rustc -vV | grep -q "^host: $TARGET$"
              cargo build --locked --release
            '
          sudo chown -R "$(id -u):$(id -g)" "native/rocker/target/$TARGET"

      - name: Package Linux target
        if: matrix.job.builder == 'container'
        id: package-linux
        shell: bash
        run: scripts/package_precompiled_nif.sh "$PROJECT_VERSION" "${{ matrix.nif }}" "${{ matrix.job.target }}"

      - name: Smoke test musl NIF
        if: contains(matrix.job.target, 'musl')
        shell: bash
        env:
          TARGET: ${{ matrix.job.target }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --env NIF_PATH="/work/native/rocker/target/$TARGET/release/librocker.so" \
            hexpm/elixir:1.15.7-erlang-26.2.3-alpine-3.19.1 \
            sh -c 'apk add --no-cache libstdc++ >/dev/null && elixir /work/scripts/smoke_precompiled_nif.exs'

      - name: Select artifact
        id: artifact
        shell: bash
        env:
          NATIVE_NAME: ${{ steps.build-native.outputs.file-name }}
          NATIVE_PATH: ${{ steps.build-native.outputs.file-path }}
          LINUX_NAME: ${{ steps.package-linux.outputs.file-name }}
          LINUX_PATH: ${{ steps.package-linux.outputs.file-path }}
        run: |
          name="${NATIVE_NAME:-$LINUX_NAME}"
          path="${NATIVE_PATH:-$LINUX_PATH}"
          test -n "$name"
          test -f "$path"
          echo "file-name=$name" >> "$GITHUB_OUTPUT"
          echo "file-path=$path" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged NIF
        if: ${{ !contains(matrix.job.target, 'musl') }}
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.artifact.outputs.file-path }}
          TARGET: ${{ matrix.job.target }}
        run: |
          rm -rf nif-smoke
          mkdir nif-smoke
          tar -xzf "$ARTIFACT_PATH" -C nif-smoke
          nif_path=$(find nif-smoke -type f | head -n1)
          test -n "$nif_path"
          if [[ "$TARGET" == *-pc-windows-* ]]; then
            nif_path=$(cygpath -w "$nif_path")
          fi
          NIF_PATH="$nif_path" elixir scripts/smoke_precompiled_nif.exs

      - name: Record artifact checksum
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.artifact.outputs.file-path }}
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARTIFACT_PATH"
          else
            shasum -a 256 "$ARTIFACT_PATH"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.file-name }}
          path: ${{ steps.artifact.outputs.file-path }}

      - name: Publish release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.file-path }}
