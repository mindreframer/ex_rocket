name: Build precompiled NIFs

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # NIF 2.16 supports Erlang/OTP 24 and later, including runtimes that
        # expose newer NIF versions.
        nif: ["2.16"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      # Cache Rust toolchain
      - name: Cache Rust toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rust-toolchain-${{ matrix.job.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            rust-toolchain-${{ matrix.job.target }}-
            rust-toolchain-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.job.target }}

      # Cache Cargo registry and dependencies
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.job.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-${{ matrix.job.target }}-
            cargo-registry-

      # Cache build artifacts (target directory)
      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            native/rocker/target
          key: cargo-build-${{ matrix.job.target }}-${{ matrix.nif }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-build-${{ matrix.job.target }}-${{ matrix.nif }}-
            cargo-build-${{ matrix.job.target }}-

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: rocker
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          # Passing the unset matrix value avoids a composite-action bug where
          # its boolean `false` default is treated as a truthy string.
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: native/rocker

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build-crate.outputs.file-path }}
        if: startsWith(github.ref, 'refs/tags/')